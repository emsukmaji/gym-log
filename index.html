<body>
<title>Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: single-column phone logbook — sticky tab bar, exercise cards as rows of set inputs, rest timer docked at bottom */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#151a21; --muted:#5d6774; --line:#d5dbe2;
  --accent:#1d55c4; --accent-ink:#ffffff; --chalk:#e3e8ee; --good:#1f7a4a; --warn:#b5600b; --danger:#b4322b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#181e26; --ink:#e8edf3; --muted:#9aa5b3; --line:#2a333f;
  --accent:#6f9cff; --accent-ink:#0b1220; --chalk:#212935; --good:#4cc488; --warn:#f0a352; --danger:#f07a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#181e26; --ink:#e8edf3; --muted:#9aa5b3; --line:#2a333f;
  --accent:#6f9cff; --accent-ink:#0b1220; --chalk:#212935; --good:#4cc488; --warn:#f0a352; --danger:#f07a70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 8px}
.top h1{font-size:30px;font-weight:700;text-transform:uppercase;line-height:1}
.top .sub{color:var(--muted);font-size:13px}
.appbar{position:sticky;top:calc(-1 * var(--appbar-lift,0px));z-index:5;background:var(--bg);margin-inline:-16px;padding-inline:16px;padding-top:var(--appbar-safe,0px);box-shadow:0 1px 0 var(--line)}
.appbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:200px;background:var(--bg)}
.tabs{display:flex;gap:4px;padding-block:6px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips span{font-size:12px;background:var(--chalk);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.meal-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.meal-row > div{min-width:0}
.meal-time{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.eat{flex:none;border:2px solid var(--line);background:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.eat[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.meter{height:10px;background:var(--chalk);border-radius:999px;overflow:hidden;margin-top:6px}
.meter div{height:100%;background:var(--good)}
.shop td{padding:4px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.shop{width:100%;border-collapse:collapse;font-size:14px}
.shop td:last-child{text-align:right;white-space:nowrap}
.tl td:last-child{white-space:normal;text-align:right;padding-left:12px}
.tl td:first-child{white-space:nowrap;vertical-align:top}
.shop td[colspan]{text-align:left;color:var(--muted);white-space:normal}
.tabs button{flex:1;font-family:var(--display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;background:none;border:0;color:var(--muted);padding:8px 4px;border-radius:8px;cursor:pointer}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-width:0;flex:1 1 auto;padding-inline:4px}
@media (max-width:389px){.tabs button{font-size:12.5px;letter-spacing:0;padding-inline:4px}}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{font-size:13px;color:var(--muted);background:var(--chalk);border-radius:8px;padding:8px 12px;margin-top:12px}
.hero{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.hero .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hero .big{font-family:var(--display);font-size:42px;font-weight:700;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;font-family:var(--display);font-size:18px;font-weight:700;cursor:pointer;color:var(--muted)}
.wseg{display:flex;flex-wrap:wrap;border-radius:12px;margin-top:12px;width:100%}
.wseg button{flex:1 1 auto;font-size:15px;padding:6px 8px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.week div{text-align:center;font-size:12px;padding:6px 0;border-radius:6px;color:var(--muted);background:var(--chalk)}
.week div.train{color:var(--ink);font-weight:700}
.week div.today{outline:2px solid var(--accent);outline-offset:-2px}
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ex-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex-head h3{font-size:22px;font-weight:600}
.target{font-family:var(--display);font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin-top:2px}
.hint.up{color:var(--good);font-weight:700}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.field{display:flex;align-items:center;background:var(--chalk);border-radius:8px;padding:0 8px;min-width:0}
.field input{width:100%;min-width:0;border:0;background:none;font-family:var(--display);font-size:22px;font-weight:600;padding:6px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--muted);opacity:.6}
.field span{font-size:12px;color:var(--muted)}
.tick{width:44px;height:40px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;font-size:20px;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.primary{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.ghost.danger{color:var(--danger);border-color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer .t{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;min-width:84px}
.timer .lbl{flex:1;font-size:13px;opacity:.8;min-width:0}
.timer button{background:none;border:1px solid currentColor;border-radius:8px;padding:6px 10px;cursor:pointer;color:inherit;font-size:13px}
.timer.done .t{color:var(--good)}
.bar{height:3px;background:var(--accent);transition:width 1s linear;margin:-10px -16px 8px}
.empty{text-align:center;color:var(--muted);padding:32px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;margin-top:16px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.sess-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--display);font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 8px}
.sess table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.sess td{padding:3px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sess td:last-child{text-align:right;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:16px}
.chart select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--chalk);color:var(--ink);max-width:100%}
.chart svg{width:100%;height:auto;display:block;margin-top:8px}
.rules{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.rules section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rules h2{font-size:22px;margin-bottom:6px}
.rules ul{margin:0;padding-left:18px}
.rules li{margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.simple{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.kgbox{display:flex;align-items:center;gap:6px;background:var(--chalk);border-radius:10px;padding:4px 10px}
.kgbox span{font-size:13px;color:var(--muted)}
.kgbox input{width:56px;border:0;background:none;font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted)}
.dot[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.prep{border-style:dashed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-align:left;cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:3px}
.plan td:last-child{text-align:left;white-space:normal;padding-left:12px}
.plan td:first-child{vertical-align:top;width:52px}
.sleep summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.sleep summary::-webkit-details-marker{display:none}
.sleep summary .label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sleep summary b{font-family:var(--display);font-size:24px}
.sleep summary .hint{color:var(--accent)}
.hint.safe{color:var(--warn);margin-top:4px}
.safe-card{border-left:4px solid var(--warn)}
.prep-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.prep-row{display:flex;gap:8px;align-items:center}
.demo.sm{width:52px;height:52px}
.prep-item{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--chalk);border:0;border-radius:10px;padding:10px;cursor:pointer;color:var(--ink)}
.prep-item b{display:block;font-size:15px}
.prep-item small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pc{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff}
.prep-item[aria-pressed="true"] .pc{background:var(--good);border-color:var(--good)}
.prep-item[aria-pressed="true"] b{color:var(--muted);text-decoration:line-through}
.ex-title{display:flex;gap:10px;align-items:center;min-width:0}
.ex-title > div{min-width:0}
.demo{flex:none;width:60px;height:60px;padding:0;border:1px solid var(--line);border-radius:10px;background:#1c2330;cursor:pointer;overflow:hidden}
.demo canvas{width:100%;height:100%;display:block}
.modal{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet canvas{width:100%;max-width:260px;aspect-ratio:1;display:block;margin:8px auto;background:#1c2330;border-radius:12px}
.sheet ol{margin:8px 0 0;padding-left:20px}
.sheet li{margin:6px 0}
.yt{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style>

<div class="wrap">
  <div class="appbar">
  <header class="top">
    <h1>Gym Log</h1>
    <div class="sub" id="sync">Memuat data…</div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-hari" data-tab="hari" aria-selected="true">Latihan</button>
    <button role="tab" id="tab-makan" data-tab="makan" aria-selected="false">Harian</button>
    <button role="tab" id="tab-riwayat" data-tab="riwayat" aria-selected="false">Riwayat</button>
    <button role="tab" id="tab-target" data-tab="target" aria-selected="false">Target</button>
    <button role="tab" id="tab-program" data-tab="program" aria-selected="false">Program</button>
  </nav>
  </div>
  <main id="view"></main>
</div>
<div class="timer" id="timer" hidden>
  <div class="bar" id="timerBar" style="width:100%"></div>
  <div class="in">
    <div class="t" id="timerT">2:00</div>
    <div class="lbl" id="timerL">Istirahat</div>
    <button id="tMinus" type="button">−15</button>
    <button id="tPlus" type="button">+15</button>
    <button id="tStop" type="button">Tutup</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="row" style="justify-content:space-between"><h2 id="mTitle" style="font-size:26px"></h2><button class="ghost" type="button" id="mClose">Tutup</button></div>
  <canvas id="mCanvas" width="440" height="440"></canvas>
  <ol id="mCues"></ol>
  <a class="yt" id="mYt" href="#" target="_blank" rel="noopener">▶ Tonton video contoh di YouTube</a>
</div></div>

<script>
const PROGRAM = {
  PU: [{id:"incline",name:"Incline dumbbell press",sets:3,min:8,max:12,unit:"rep",inc:2,rest:120},{id:"chestpress",name:"Chest press machine",sets:3,min:8,max:12,unit:"rep",rest:90},{id:"sdbpress",name:"Dumbbell shoulder press",sets:3,min:8,max:12,unit:"rep",inc:2,rest:90},{id:"clateral",name:"Cable lateral raise",sets:4,min:12,max:15,unit:"rep",rest:60},{id:"pushdown",name:"Triceps pushdown",sets:3,min:10,max:15,unit:"rep",rest:60},{id:"ohext",name:"Overhead triceps extension",sets:3,min:10,max:15,unit:"rep",inc:2,rest:60},{id:"ccrunch",name:"Cable crunch",sets:3,min:12,max:15,unit:"rep",rest:60}],
  PL: [{id:"pulldown",name:"Wide grip lat pulldown",sets:3,min:8,max:12,unit:"rep",rest:90},{id:"csrow",name:"Chest supported row",sets:3,min:8,max:12,unit:"rep",rest:90},{id:"crow",name:"Seated cable row",sets:3,min:8,max:12,unit:"rep",rest:90},{id:"revpec",name:"Reverse pec deck",sets:3,min:12,max:15,unit:"rep",rest:60},{id:"curl",name:"Dumbbell curl",sets:3,min:10,max:15,unit:"rep",inc:2,rest:60},{id:"hammer",name:"Hammer curl",sets:3,min:10,max:15,unit:"rep",inc:2,rest:60}],
  LG: [{id:"squat",name:"Back squat",sets:3,min:6,max:10,unit:"rep",lower:true,rest:150},{id:"legpress",name:"Leg press",sets:3,min:8,max:12,unit:"rep",lower:true,rest:120},{id:"rdl",name:"Romanian deadlift",sets:3,min:8,max:12,unit:"rep",lower:true,rest:120},{id:"legext",name:"Leg extension",sets:3,min:12,max:15,unit:"rep",lower:true,rest:60},{id:"lcurl",name:"Lying leg curl",sets:3,min:10,max:15,unit:"rep",lower:true,rest:60},{id:"scalf",name:"Standing calf raise",sets:4,min:12,max:15,unit:"rep",lower:true,rest:60},{id:"legraise",name:"Lying leg raise",sets:3,min:12,max:15,unit:"rep",bodyweight:true,rest:60}],
  VT: [{id:"pulldown",name:"Lat pulldown",sets:3,min:8,max:12,unit:"rep",rest:90},{id:"sapd",name:"Single arm lat pulldown",sets:3,min:10,max:12,unit:"rep",rest:60},{id:"incline",name:"Incline dumbbell press",sets:3,min:8,max:12,unit:"rep",inc:2,rest:120},{id:"clateral",name:"Cable lateral raise",sets:4,min:12,max:15,unit:"rep",rest:60},{id:"revpec",name:"Reverse pec deck",sets:3,min:12,max:15,unit:"rep",rest:60},{id:"sapull",name:"Straight arm pulldown",sets:3,min:12,max:15,unit:"rep",rest:60},{id:"plank",name:"Plank",sets:3,min:45,max:45,unit:"detik",bodyweight:true,rest:60}],
  AU: [{id:"inccurl",name:"Incline dumbbell curl",sets:3,min:10,max:15,unit:"rep",inc:2,rest:60},{id:"hammer",name:"Hammer curl",sets:3,min:10,max:15,unit:"rep",inc:2,rest:60},{id:"pushdown",name:"Triceps pushdown",sets:3,min:10,max:15,unit:"rep",rest:60},{id:"ohext",name:"Overhead triceps extension",sets:3,min:10,max:15,unit:"rep",inc:2,rest:60},{id:"legpress",name:"Leg press",sets:3,min:8,max:12,unit:"rep",lower:true,rest:120},{id:"lcurl",name:"Lying leg curl",sets:3,min:10,max:15,unit:"rep",lower:true,rest:60},{id:"scalf",name:"Standing calf raise",sets:3,min:12,max:15,unit:"rep",lower:true,rest:60}],

  R:  [{id:"tread",name:"Treadmill jalan cepat",sets:1,min:20,max:30,unit:"menit",bodyweight:true,rest:0},{id:"ccrunch",name:"Cable crunch",sets:3,min:12,max:15,unit:"rep",rest:60},{id:"plank",name:"Plank",sets:3,min:30,max:45,unit:"detik",bodyweight:true,rest:60}],
  UB: [{id:"inclinebb",name:"Incline bench press",sets:3,min:8,max:10,unit:"rep",rest:120},{id:"crow",name:"Seated cable row",sets:3,min:10,max:12,unit:"rep",rest:90},{id:"pulldown",name:"Lat pulldown",sets:3,min:10,max:12,unit:"rep",rest:90},{id:"clateral",name:"Cable lateral raise",sets:3,min:12,max:15,unit:"rep",rest:60},{id:"ccurl",name:"Cable curl",sets:2,min:10,max:12,unit:"rep",rest:60},{id:"pushdown",name:"Triceps pushdown",sets:2,min:10,max:12,unit:"rep",rest:60}],

  if(ex.bodyweight)return {kg:null,text:ex.unit==="menit"?"Jalan agak cepat, masih bisa ngobrol.":ex.unit==="rep"?"Tanpa beban. Gerak pelan dan terkontrol, punggung bawah tetap menempel.":"Tahan badan lurus dari kepala sampai tumit."};
  const top=prev?Math.max(0,...prev.map(x=>+x.kg||0)):0;
  if(!top)return {kg:null,text:"Pertama kali: pilih beban yang bisa kamu angkat "+ex.max+" kali dengan teknik benar."};
  const inc=ex.inc||(ex.lower?5:2.5);
  return {kg:top,text:"Terakhir "+top+" kg. Kalau semua set lancar sampai "+ex.max+" rep, naik ke "+(top+inc)+" kg."};
}

function loadDraft(){
  const d=lsGet("gymlog-draft");
  if(!d||!d.workout||d.workout!==WDAY[new Date().getDay()]||!(Date.now()-d.started<1000*60*60*8))return null;
  /* isian lama dari versi program sebelumnya: buang kalau gerakannya tidak cocok lagi */
  const prog=PROGRAM[d.workout]||[];
  if(!d.sets||prog.some(ex=>!Array.isArray(d.sets[ex.id])||d.sets[ex.id].length!==ex.sets))return null;
  return d;
}

function chartSvg(id){
  const pts=sorted().reverse().map(x=>{const r=(x.sets&&x.sets[id]||[]).filter(y=>+y.kg);return r.length?{ts:x.ts,kg:Math.max(...r.map(y=>+y.kg))}:null}).filter(Boolean);
  const W=560,H=200,L=40,R=16,T=16,B=28;
  if(pts.length<2)return `<p class="hint">Grafik muncul setelah dua sesi gerakan ini tersimpan. Sekarang: ${pts.length?pts[0].kg+" kg":"belum ada"}.</p>`;
  let lo=Math.min(...pts.map(p=>p.kg)),hi=Math.max(...pts.map(p=>p.kg));
  const step=hi-lo>20?10:5;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  const x=i=>L+(W-L-R)*i/(pts.length-1);const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g="";for(let v=lo;v<=hi;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`}
  const line=pts.map((p,i)=>`${x(i)},${y(p.kg)}`).join(" ");
  const area=`${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}`;
  const fmt=t=>new Date(t).toLocaleDateString("id-ID",{day:"numeric",month:"short"});
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik beban terberat">${g}
  <polygon points="${area}" fill="var(--accent)" opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="${x(pts.length-1)}" cy="${y(last.kg)}" r="5" fill="var(--accent)"/>
  <text x="${L}" y="${H-8}" font-size="12" fill="var(--muted)">${fmt(pts[0].ts)}</text><text x="${W-R}" y="${H-8}" font-size="12" text-anchor="end" fill="var(--muted)">${fmt(last.ts)} · ${last.kg} kg</text></svg>`;
}

/* ---------- timer ---------- */
const timer={end:0,total:0,h:null,beeped:false};
let audioCtx=null;
function startTimer(sec,name){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(_){}
  timer.total=sec*1000;timer.end=Date.now()+timer.total;timer.beeped=false;
  $("#timerL").textContent="Istirahat setelah "+name;$("#timer").hidden=false;$("#timer").classList.remove("done");
  clearInterval(timer.h);timer.h=setInterval(tick,250);tick();
}
function tick(){
  const left=Math.max(0,timer.end-Date.now());const s=Math.ceil(left/1000);
  $("#timerT").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  $("#timerBar").style.width=(timer.total?Math.min(100,left/timer.total*100):0)+"%";
  if(left<=0&&!timer.beeped){timer.beeped=true;$("#timer").classList.add("done");$("#timerL").textContent="Waktunya set berikutnya";beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){}}
}
function stopTimer(){clearInterval(timer.h);$("#timer").hidden=true}
function beep(){try{if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6);o.start();o.stop(audioCtx.currentTime+.6)}catch(_){}}

/* ---------- storage ---------- */
async function finish(){
  const sets={};
  for(const ex of PROGRAM[draft.workout])sets[ex.id]=draft.sets[ex.id].filter(x=>x.done).map(x=>({kg:ex.bodyweight?0:(+x.kg||0),reps:+x.reps||0}));
  const id="s"+Date.now().toString(36);
  const sess={workout:draft.workout,ts:Date.now(),sets};
  $("#finish").disabled=true;
  try{
    if(mode==="db"&&col){await col.doc(id).set(sess)}
    else{sessions.push({id,...sess});lsSet("gymlog-sessions",sessions)}
  }catch(err){
    $("#finish").disabled=false;
    toast(err&&err.code==="quota_exceeded"?"Penyimpanan penuh. Hapus sesi lama dulu.":"Gagal menyimpan. Coba tekan lagi.");return;
  }
  if(mode!=="db")render();
  try{localStorage.removeItem("gymlog-draft")}catch(_){}
  stopTimer();
  draft=null;
  toast(WL[sess.workout]+" tersimpan. Berikutnya: "+WL[nextAfter(sess.workout)]);
  tab="riwayat";render();window.scrollTo(0,0);
}
async function removeSession(id){
  pendingDelete=null;
  try{
    if(mode==="db"&&col){await col.doc(id).delete()}
    else{sessions=sessions.filter(s=>s.id!==id);lsSet("gymlog-deleted",[...new Set([...(lsGet("gymlog-deleted")||[]),id])]);lsSet("gymlog-sessions",sessions)}
    toast("Sesi dihapus");
  }catch(_){toast("Gagal menghapus. Coba lagi.")}
  render();
}

/* ---------- sinkron antar perangkat lewat GitHub Gist privat ---------- */
const GIST_FILE="gymlog-data.json";
const SYNC={busy:false,timer:null,err:"",again:false};
function syncToken(){try{return localStorage.getItem("gymlog-sync-token")||""}catch(_){return ""}}
function syncOn(){return mode==="local"&&!!syncToken()}
function ghFetch(path,opt={}){
  return fetch("https://api.github.com"+path,{...opt,cache:"no-store",headers:{"Authorization":"Bearer "+syncToken(),"Accept":"application/vnd.github+json","Content-Type":"application/json"}}).then(async r=>{
    if(r.status===401)throw new Error("Token tidak valid atau sudah kedaluwarsa.");
    if(r.status===404)throw new Error("NOTFOUND");
    if(!r.ok)throw new Error("GitHub menolak permintaan ("+r.status+").");
    return r.json();
  });
}
function collectState(){
  const meta=lsGet("gymlog-meta")||{},keys={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&syncable(k))keys[k]={v:lsGet(k),u:meta[k]||0}}}catch(_){}
  return {app:"gym-log",v:1,keys};
}
function mergeState(a,b){
  const out={app:"gym-log",v:1,keys:{}},A=(a&&a.keys)||{},B=(b&&b.keys)||{};
  const del=new Set([...((A["gymlog-deleted"]||{}).v||[]),...((B["gymlog-deleted"]||{}).v||[])]);
  for(const k of new Set([...Object.keys(A),...Object.keys(B)])){
    const x=A[k],y=B[k];
    if(!x||!y){out.keys[k]=x||y;continue}
    const u=Math.max(x.u||0,y.u||0);
    if(k==="gymlog-sessions"){
      const m={};for(const s of [...(x.v||[]),...(y.v||[])])if(s&&s.id)m[s.id]=s;
      out.keys[k]={v:Object.values(m).filter(s=>!del.has(s.id)).sort((p,q)=>p.ts-q.ts),u};
    }else if(k==="gymlog-weights"){
      const m={};for(const w of [...(x.v||[]),...(y.v||[])])if(w&&w.date&&(!m[w.date]||(w.u||0)>=(m[w.date].u||0)))m[w.date]=w;
      out.keys[k]={v:Object.values(m).sort((p,q)=>p.date<q.date?-1:1),u};
    }else if(k==="gymlog-photos"||k==="gymlog-deleted"){
      out.keys[k]={v:[...new Set([...(x.v||[]),...(y.v||[])])].sort(),u};
    }else out.keys[k]=(x.u||0)>=(y.u||0)?x:y;
  }
  if(out.keys["gymlog-deleted"])out.keys["gymlog-deleted"].v=[...del];
  return out;
}
function applyState(st){
  const meta=lsGet("gymlog-meta")||{};
  for(const k in st.keys){try{localStorage.setItem(k,JSON.stringify(st.keys[k].v))}catch(_){}meta[k]=st.keys[k].u||0}
  try{localStorage.setItem("gymlog-meta",JSON.stringify(meta))}catch(_){}
}
async function findOrCreateGist(){
  let id="";try{id=localStorage.getItem("gymlog-sync-gist")||""}catch(_){}
  if(id){try{await ghFetch("/gists/"+id);return id}catch(e){if(e.message!=="NOTFOUND")throw e}}
  const list=await ghFetch("/gists?per_page=100");
  const hit=list.find(g=>g.files&&g.files[GIST_FILE]);
  if(hit)id=hit.id;
  else{const g=await ghFetch("/gists",{method:"POST",body:JSON.stringify({description:"Gym Log data (sinkron otomatis)",public:false,files:{[GIST_FILE]:{content:JSON.stringify(collectState())}}})});id=g.id}
  try{localStorage.setItem("gymlog-sync-gist",id)}catch(_){}
  return id;
}
async function syncNow(){
  if(!syncOn())return;
  if(SYNC.busy){SYNC.again=true;return}
  SYNC.busy=true;SYNC.err="";setSyncLabel();
  try{
    const id=await findOrCreateGist();
    const g=await ghFetch("/gists/"+id);
    let remote=null;const f=g.files&&g.files[GIST_FILE];
    if(f){let txt=f.content;if(f.truncated&&f.raw_url)txt=await fetch(f.raw_url,{cache:"no-store"}).then(r=>r.text());try{remote=JSON.parse(txt)}catch(_){}}
    const local=collectState(),merged=mergeState(local,remote);
    const mergedTxt=JSON.stringify(merged);
    if(mergedTxt!==JSON.stringify(local)){applyState(merged);reloadLocal()}
    if(!remote||mergedTxt!==JSON.stringify(remote))await ghFetch("/gists/"+id,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:mergedTxt}}})});
    try{localStorage.setItem("gymlog-sync-last",String(Date.now()))}catch(_){}
  }catch(e){SYNC.err=e.message||"Tidak bisa terhubung ke GitHub."}
  SYNC.busy=false;setSyncLabel();
  if(SYNC.again){SYNC.again=false;scheduleSync(800)}
}
function scheduleSync(ms){if(!syncOn())return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncNow,ms||1500)}
function reloadLocal(){
  sessions=lsGet("gymlog-sessions")||[];weights=lsGet("gymlog-weights")||[];photos=lsGet("gymlog-photos")||[];profile=lsGet("gymlog-profile");
  habitDone=lsGet("gymlog-habits-"+dateKey())||[];mealDone=lsGet("gymlog-meals-"+dateKey())||[];
  const a=document.activeElement;if(a&&a.tagName==="INPUT")return;render();
}
function setSyncLabel(){
  const el=$("#sync");if(!el||mode!=="local")return;
  if(!syncToken()){el.textContent="Tersimpan di browser ini";return}
  if(SYNC.busy){el.textContent="Menyinkronkan…";return}
  if(SYNC.err){el.textContent="Sinkron gagal · coba lagi";return}
  let t=0;try{t=+localStorage.getItem("gymlog-sync-last")||0}catch(_){}
  el.textContent=t?"Tersinkron "+new Date(t).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}):"Sinkron aktif";
}
function syncSection(){
  if(mode==="db")return `<section><h2>Sinkron antar perangkat</h2><p class="hint">Versi Claude ini tersimpan di akun Claude-mu. Untuk sinkron Safari, Chrome, dan Home Screen, pakai link <b>emsukmaji.github.io/gym-log</b> lalu aktifkan sinkron di tab Target di sana.</p></section>`;
  const tok=syncToken();
  if(tok){let t=0;try{t=+localStorage.getItem("gymlog-sync-last")||0}catch(_){}
    return `<section><h2>Sinkron antar perangkat</h2><p><b>Aktif.</b> ${t?`Terakhir tersinkron ${new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}.`:""} ${SYNC.err?`<br><span style="color:var(--warn)">${esc(SYNC.err)}</span>`:""}</p>
    <p class="hint">Data disimpan di Gist privat di akun GitHub-mu dan otomatis disamakan setiap kali ada perubahan, saat aplikasi dibuka, dan setiap menit. Untuk perangkat lain, buka link yang sama lalu tempel token yang sama di sini.</p>
    <div class="row" style="margin-top:8px"><button class="ghost" type="button" id="syncNowBtn" style="padding:10px 14px">Sinkron sekarang</button><button class="ghost" type="button" id="syncCopy" style="padding:10px 14px">Salin token</button><button class="ghost danger" type="button" id="syncOff" style="padding:10px 14px">Putuskan di perangkat ini</button></div></section>`}
  return `<section class="safe-card"><h2>Sinkron antar perangkat</h2><p class="hint">Supaya progres sama di Safari, Chrome laptop, dan aplikasi Home Screen, sambungkan ke GitHub sekali di setiap perangkat.</p>
  <ol style="margin:8px 0 0;padding-left:20px"><li>Buka <a href="https://github.com/settings/tokens/new?scopes=gist&description=Gym%20Log%20sync" target="_blank" rel="noopener">halaman buat token GitHub</a>.</li><li>Di <b>Expiration</b> pilih <b>No expiration</b>. Pastikan hanya <b>gist</b> yang dicentang.</li><li>Tekan <b>Generate token</b>, salin kodenya (diawali ghp_).</li><li>Tempel di bawah, lalu tekan <b>Sambungkan</b>.</li></ol>
  <form id="syncForm" class="row" style="margin-top:10px"><input id="syncTok" type="password" autocomplete="off" placeholder="ghp_…" aria-label="Token GitHub" style="flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--chalk);color:var(--ink)"><button class="ghost" type="submit" style="padding:10px 14px">Sambungkan</button></form>
  <p class="hint" style="margin-top:6px">Token ini hanya bisa mengakses Gist, bukan repo atau akunmu. Simpan juga di catatan HP supaya mudah ditempel di perangkat lain.</p></section>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="syncForm")return;e.preventDefault();
  const tok=($("#syncTok").value||"").trim();if(!/^(ghp_|github_pat_)/.test(tok)){toast("Token harus diawali ghp_ atau github_pat_");return}
  try{localStorage.setItem("gymlog-sync-token",tok)}catch(_){}
  toast("Menyambungkan…");await syncNow();
  if(SYNC.err){toast(SYNC.err);try{localStorage.removeItem("gymlog-sync-token")}catch(_){};render()}else{toast("Sinkron aktif. Data aman di GitHub.");render()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(lastDay&&dateKey()!==lastDay)render();scheduleSync(300)}});
setInterval(()=>{if(document.visibilityState==="visible")syncNow()},60000);

/* ---------- ringkasan progres, foto, backup ---------- */
let photos=[];
function progressSummary(){
  const asc=[...weights].sort((a,b)=>a.date<b.date?-1:1);if(asc.length<2)return "";
  const first=f=>asc.find(w=>w[f]),last=f=>[...asc].reverse().find(w=>w[f]);
  const row=(f,label,good)=>{const a=first(f),b=last(f);if(!a||!b||a===b)return "";const d=Math.round((b[f]-a[f])*10)/10;const ok=good==="down"?d<0:d>0;
    return `<tr><td>${label}</td><td style="color:${d===0?"var(--muted)":ok?"var(--good)":"var(--warn)"}">${d>0?"+":""}${String(d).replace(".",",")} ${f==="kg"?"kg":"cm"}</td></tr>`};
  const rows=row("kg","Berat","down")+row("waist","Perut","down")+row("arm","Lengan","up")+row("thigh","Paha","up");
  return rows?`<section><h2>Perubahan sejak awal</h2><table class="shop">${rows}</table><p class="hint">Hijau berarti ke arah target: perut dan berat turun, lengan dan paha naik.</p></section>`:"";
}
function photoSection(){
  const last=photos.length?photos[photos.length-1]:null;
  const due=last?new Date(new Date(last+"T12:00:00").getTime()+28*864e5):null;
  const now=new Date(),overdue=!last||due<=now;
  return `<section${overdue?' class="safe-card"':""}><h2>Foto progres</h2><p class="hint">Setiap 4 minggu: foto depan, samping, dan wajah. Tempat, cahaya, dan jam yang sama (pagi sebelum makan). Simpan di album khusus di galeri HP, tidak perlu diunggah ke sini.</p>
  <p>${last?`Terakhir: <b>${fmtDate(last)}</b> · berikutnya: <b>${due.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}</b>`:"<b>Belum ada foto awal.</b> Ambil foto pertama sebelum mulai latihan."}</p>
  <button class="ghost" type="button" id="photoDone" style="padding:10px 14px">Sudah foto hari ini</button></section>`;
}
async function markPhoto(){
  const d=dateKey();if(photos.includes(d)){toast("Foto hari ini sudah tercatat");return}
  photos=[...photos,d].sort();
  try{if(mode==="db"&&col)await col.doc("photos").set({kind:"photos",dates:photos});else lsSet("gymlog-photos",photos);toast("Foto progres tercatat");render()}catch(_){toast("Gagal menyimpan. Coba lagi.")}
}
function backupSection(){
  if(mode==="db")return `<section><h2>Keamanan data</h2><p class="hint">Di versi Claude, semua catatan tersimpan otomatis di akunmu dan ikut ke perangkat lain.</p>${backupButtons()}</section>`;
  const lb=lsGet("gymlog-lastbackup");
  return `<section class="${!lb||Date.now()-lb>7*864e5?"safe-card":""}"><h2>Backup data</h2><p class="hint">Catatan di halaman ini hanya tersimpan di browser HP ini. Kalau data browser dihapus atau ganti HP, catatan bisa hilang. Download backup seminggu sekali dan simpan di Google Drive atau WhatsApp ke diri sendiri.</p>
  <p>${lb?`Backup terakhir: <b>${new Date(lb).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}</b>`:"<b>Belum pernah backup.</b>"}</p>${backupButtons()}</section>`;
}
function backupButtons(){
  return `<div class="row" style="margin-top:8px"><button class="ghost" type="button" id="bkDown" style="padding:10px 14px">Download backup</button>
  <label class="ghost" style="padding:10px 14px;cursor:pointer">Pulihkan dari backup<input id="bkFile" type="file" accept="application/json,.json" hidden></label></div>`;
}
function collectBackup(){
  const ls={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("gymlog-")&&k!=="gymlog-draft")ls[k]=localStorage.getItem(k)}}catch(_){}
  return {app:"gym-log",version:1,exported:new Date().toISOString(),sessions,weights,photos,ls};
}
async function downloadBackup(){
  const data=JSON.stringify(collectBackup()),filename="gymlog-backup-"+dateKey()+".json";
  if(window.claude&&window.claude.use){try{const dl=await claude.use("downloads");if(dl){await dl.save({filename,data});lsSet("gymlog-lastbackup",Date.now());toast("Backup disimpan.");render();return}}catch(_){toast("Backup dibatalkan.");return}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch(_){}
  lsSet("gymlog-lastbackup",Date.now());toast("Backup dibuat. Cek folder Download.");render();
}
async function restoreBackup(file){
  try{
    const d=JSON.parse(await file.text());if(d.app!=="gym-log")throw 0;
    if(mode==="db"&&col){
      for(const x of d.sessions||[]){const {id,...rest}=x;if(id)await col.doc(id).set(rest)}
      for(const w of d.weights||[])await col.doc("w-"+w.date).set(w);
      if((d.photos||[]).length)await col.doc("photos").set({kind:"photos",dates:d.photos});
    }else{
      for(const k in d.ls||{})try{localStorage.setItem(k,d.ls[k])}catch(_){}
      if(d.sessions)lsSet("gymlog-sessions",d.sessions);if(d.weights)lsSet("gymlog-weights",d.weights);if(d.photos)lsSet("gymlog-photos",d.photos);
      useLocal();
    }
    toast("Data berhasil dipulihkan");
  }catch(_){toast("File backup tidak bisa dibaca. Pastikan file gymlog-backup yang benar.")}
}
function backupBanner(){
  if(mode!=="local"||syncToken())return "";
  const lb=lsGet("gymlog-lastbackup");if(!sessions.length&&!weights.length)return "";
  if(lb&&Date.now()-lb<7*864e5)return "";
  return `<div class="notice safe-card" style="margin-bottom:12px">Sudah lebih dari seminggu belum backup data. Buka tab <b>Target</b> lalu tekan <b>Download backup</b>.</div>`;
}
document.addEventListener("change",e=>{if(e.target.id==="bkFile"&&e.target.files[0])restoreBackup(e.target.files[0])});

/* ---------- target & berat badan ---------- */
/* profil pribadi: tidak ditulis di kode, disimpan di data pribadi yang tersinkron */
let profile=null;
const CONDS=[["perut","Perut berlemak"],["lengan","Lengan kecil"],["kaki","Kaki kecil"],["pipi","Pipi tembem"]];
function goalOf(P){const fat=(P.conds||[]).includes("perut")||(P.weight/((P.height/100)**2))>=25;return fat?{lo:Math.round(P.weight-5),hi:Math.round(P.weight-3),fat}:{lo:Math.round(P.weight),hi:Math.round(P.weight+3),fat}}
function profileForm(P){
  P=P||{};const today=dateKey();
  return `<section class="${P.age?"":"safe-card"}"><h2>${P.age?"Ubah profil":"Isi profil kamu"}</h2><p class="hint">Disimpan sebagai data pribadi: di perangkat ini dan di Gist privat GitHub-mu kalau sinkron aktif. Tidak tertulis di kode, jadi tidak terlihat oleh orang lain yang membuka link ini.</p>
  <form id="pForm" style="margin-top:8px;display:flex;flex-direction:column;gap:10px">
  <div class="row"><label class="kgbox"><span>Umur</span><input id="pAge" inputmode="numeric" value="${esc(P.age||"")}" aria-label="Umur dalam tahun"><span>th</span></label>
  <label class="kgbox"><span>Tinggi</span><input id="pHeight" inputmode="decimal" value="${esc(P.height||"")}" aria-label="Tinggi dalam cm"><span>cm</span></label>
  <label class="kgbox"><span>Berat awal</span><input id="pWeight" inputmode="decimal" value="${esc(P.weight||"")}" aria-label="Berat awal dalam kg"><span>kg</span></label></div>
  <label class="kgbox" style="align-self:flex-start"><span>Mulai</span><input id="pStart" type="date" value="${esc(P.start||today)}" style="width:auto;font-size:16px" aria-label="Tanggal mulai program"></label>
  <div><span class="hint">Kondisi awal (boleh lebih dari satu)</span><div class="row" style="margin-top:6px">${CONDS.map(c=>`<label class="kgbox" style="cursor:pointer"><input type="checkbox" class="pCond" value="${c[0]}" ${(P.conds||[]).includes(c[0])?"checked":""} style="width:auto"> <span style="color:var(--ink)">${c[1]}</span></label>`).join("")}</div></div>
  <div class="row"><button class="ghost" type="submit" style="padding:10px 14px">Simpan profil</button>${P.age?`<button class="ghost" type="button" id="pCancel" style="padding:10px 14px">Batal</button>`:""}</div></form></section>`;
}
let editingProfile=false;
document.addEventListener("submit",async e=>{
  if(e.target.id!=="pForm")return;e.preventDefault();
  const n=id=>parseFloat(($(id).value||"").replace(",","."));
  const P={age:Math.round(n("#pAge")),height:n("#pHeight"),weight:n("#pWeight"),start:$("#pStart").value||dateKey(),conds:[...document.querySelectorAll(".pCond:checked")].map(x=>x.value),u:Date.now()};
  if(!(P.age>=10&&P.age<=100)||!(P.height>=120&&P.height<=230)||!(P.weight>=30&&P.weight<=250)){toast("Cek lagi umur, tinggi, dan berat.");return}
  try{if(mode==="db"&&col)await col.doc("profile").set(P);else lsSet("gymlog-profile",P);profile=P;editingProfile=false;toast("Profil tersimpan");render()}catch(_){toast("Gagal menyimpan profil. Coba lagi.")}
});
let weights=[];
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}
function addMonths(d,m){const x=new Date(d+"T12:00:00");x.setMonth(x.getMonth()+m);return x.toLocaleDateString("id-ID",{month:"long",year:"numeric"})}
function weightChart(){
  const pts=[...weights].sort((a,b)=>a.date<b.date?-1:1);
  if(!pts.length)return `<p class="hint">Grafik muncul setelah kamu mencatat berat pertama.</p>`;
  const W=560,H=200,L=40,R=16,T=14,B=28;
  const G=profile?goalOf(profile):null;
  let lo=Math.min(G?G.lo-1:Infinity,...pts.map(p=>p.kg)),hi=Math.max(profile?profile.weight+1:-Infinity,...pts.map(p=>p.kg));lo=Math.floor(lo);hi=Math.ceil(hi);if(hi-lo<2){hi+=1;lo-=1}
  const n=Math.max(pts.length-1,1),x=i=>L+(W-L-R)*(pts.length===1?.5:i/n),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g="";for(let v=lo;v<=hi;v+=1){if((v-lo)%2)continue;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`}
  const band=!G?"":`<rect x="${L}" y="${y(G.hi)}" width="${W-L-R}" height="${y(G.lo)-y(G.hi)}" fill="var(--good)" opacity=".14"/><text x="${W-R-4}" y="${y(G.hi)+14}" text-anchor="end" font-size="12" fill="var(--good)">target ${G.lo}–${G.hi} kg</text>`;
  const line=pts.map((p,i)=>`${x(i)},${y(p.kg)}`).join(" "),last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik berat badan">${g}${band}<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.kg)}" r="${i===pts.length-1?5:3}" fill="var(--accent)"/>`).join("")}
  <text x="${L}" y="${H-8}" font-size="12" fill="var(--muted)">${fmtDate(pts[0].date)}</text><text x="${W-R}" y="${H-8}" font-size="12" text-anchor="end" fill="var(--muted)">${fmtDate(last.date)} · ${last.kg} kg</text></svg>`;
}
function renderTarget(){
  const P=profile;
  const sorted=[...weights].sort((a,b)=>a.date<b.date?1:-1),cur=sorted[0];
  let top;
  if(!P||editingProfile){top=`<div class="hero"><div><div class="label">Rekomposisi badan · bakar lemak, bangun otot</div><div class="big">Target</div></div></div><div class="rules">${profileForm(P)}`}
  else{
    const G=goalOf(P),bmi=(P.weight/((P.height/100)**2)).toFixed(1).replace(".",","),diff=cur?(cur.kg-P.weight):0,c=P.conds||[];
    const fmt=v=>String(v).replace(".",",");
    const parts=CONDS.filter(x=>c.includes(x[0])).map(x=>x[1].toLowerCase());
    const desc=parts.length?`Kondisi awal: ${parts.join(", ")}. `:"";
    const recomp=G.fat?`${c.includes("lengan")||c.includes("kaki")?"Ini pola <b>skinny fat</b>: berat badan sebenarnya sudah cukup, tapi ototnya sedikit dan lemaknya menumpuk. ":""}Jadi targetnya bukan menaikkan berat, melainkan <b>mengganti lemak dengan otot</b>.`:"Targetnya <b>menambah otot</b> dengan berat naik pelan-pelan.";
    top=`<div class="hero"><div><div class="label">Rekomposisi badan · bakar lemak, bangun otot</div><div class="big">${G.lo}–${G.hi} kg</div><div class="hint">Target 6 bulan${G.fat?", dengan perut lebih rata dan otot lebih berisi":""}</div></div></div>
  <div class="chips" style="margin-top:12px"><span>${P.age} tahun</span><span>${fmt(P.height)} cm</span><span>Awal ${fmt(P.weight)} kg</span><span>BMI ${bmi}</span>${cur?`<span>Sekarang ${fmt(cur.kg)} kg (${diff>0?"+":""}${diff.toFixed(1).replace(".",",")})</span>`:""}<button type="button" class="ghost" id="pEdit" style="padding:2px 10px;font-size:12px">Ubah profil</button></div>
  <div class="rules">
  <section><h2>Kondisi awal</h2><p>${desc}${recomp}</p></section>`;
  }
  $("#view").innerHTML=`${top}
  <section><h2>Strategi</h2><ul>
  <li><b>Makan:</b> sekitar 2.000 kkal per hari (defisit ringan) dengan protein minimal 100 g. Menu di tab Harian sudah disesuaikan.</li>
  <li><b>Latihan beban:</b> 5 hari sesuai program. Kaki dilatih 2 kali seminggu dan perut 3 kali supaya lengan dan kaki lebih berisi.</li>
  <li><b>Gerak harian:</b> targetkan 8.000 langkah per hari di luar gym, misalnya jalan kaki ke warteg atau saat istirahat kerja.</li>
  <li><b>Tidur:</b> 7–9 jam. Kurang tidur membuat lapar dan lemak perut susah turun.</li>
  <li><b>Wajah:</b> lemak tidak bisa dibakar hanya di pipi. Pipi ikut tirus saat lemak badan turun, dibantu mengurangi garam dan minuman manis.</li></ul></section>
  <section><h2>Perkiraan timeline</h2><table class="shop tl">
  <tr><td><b>Bulan 1</b><br><small class="hint">${P?addMonths(P.start,1):"bulan ke-1"}</small></td><td>${P?"±"+Math.round(P.weight-(goalOf(P).fat?1:-0.5))+" kg":"—"}<br><small class="hint">Teknik dan kekuatan naik</small></td></tr>
  <tr><td><b>Bulan 3</b><br><small class="hint">${P?addMonths(P.start,3):"bulan ke-3"}</small></td><td>${P?(goalOf(P).fat?"±"+Math.round(P.weight-3)+"–"+Math.round(P.weight-2)+" kg":"±"+Math.round(P.weight+1)+" kg"):"—"}<br><small class="hint">Lingkar perut mulai turun, wajah mulai tirus</small></td></tr>
  <tr><td><b>Bulan 6</b><br><small class="hint">${P?addMonths(P.start,6):"bulan ke-6"}</small></td><td>${P?goalOf(P).lo+"–"+goalOf(P).hi+" kg":"—"}<br><small class="hint">Perut lebih rata, otot lengan dan kaki lebih berisi</small></td></tr>
  <tr><td><b>Bulan 6–12</b><br><small class="hint">${P?"sampai "+addMonths(P.start,12):"lanjutan"}</small></td><td>Naik pelan<br><small class="hint">Fase tambah otot: kalori dinaikkan ke ±2.400</small></td></tr></table>
  <p class="hint">Perkiraan untuk latihan dan makan yang konsisten. Hasil tiap orang bisa lebih cepat atau lebih lambat. Kalau berat turun lebih dari 1 kg per minggu, tambah sedikit porsi makan supaya otot tidak ikut hilang.</p></section>
  ${progressSummary()}<section><h2>Catat progres mingguan</h2><p class="hint">Setiap Senin pagi setelah bangun tidur dan buang air, sebelum makan. Perut diukur sejajar pusar, lengan di bagian paling besar lengan atas kanan (rileks), paha di bagian paling besar paha kanan. Pakai meteran jahit.</p>
  <form id="wForm" class="row" style="margin-top:8px">
  <label class="kgbox"><span>Berat</span><input id="wKg" inputmode="decimal" placeholder="${cur?cur.kg:(P?P.weight:"—")}" aria-label="Berat badan dalam kg"><span>kg</span></label>
  <label class="kgbox"><span>Perut</span><input id="wWaist" inputmode="decimal" placeholder="—" aria-label="Lingkar perut dalam cm"><span>cm</span></label>
  <label class="kgbox"><span>Lengan</span><input id="wArm" inputmode="decimal" placeholder="—" aria-label="Lingkar lengan dalam cm"><span>cm</span></label>
  <label class="kgbox"><span>Paha</span><input id="wThigh" inputmode="decimal" placeholder="—" aria-label="Lingkar paha dalam cm"><span>cm</span></label>
  <button class="ghost" type="submit" style="padding:10px 14px">Simpan</button></form>
  <div class="chart" style="margin-top:12px">${weightChart()}</div>
  ${sorted.length?`<table class="shop" style="margin-top:8px">${sorted.slice(0,8).map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${String(w.kg).replace(".",",")} kg${w.waist?` · perut ${String(w.waist).replace(".",",")}`:""}${w.arm?` · lengan ${String(w.arm).replace(".",",")}`:""}${w.thigh?` · paha ${String(w.thigh).replace(".",",")}`:""}</td></tr>`).join("")}</table>`:""}</section>${syncSection()}${photoSection()}${backupSection()}</div>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="wForm")return;e.preventDefault();
  const rd=id=>parseFloat(($(id).value||"").replace(",",".")),kg=rd("#wKg"),waist=rd("#wWaist"),arm=rd("#wArm"),thigh=rd("#wThigh");
  if(!(kg>30&&kg<200)){toast("Isi berat dalam kg, misalnya 65,5");return}
  const entry={kind:"weight",date:dateKey(),kg:Math.round(kg*10)/10,u:Date.now()};if(waist>40&&waist<200)entry.waist=Math.round(waist*10)/10;if(arm>15&&arm<70)entry.arm=Math.round(arm*10)/10;if(thigh>25&&thigh<100)entry.thigh=Math.round(thigh*10)/10;
  try{
    if(mode==="db"&&col){await col.doc("w-"+entry.date).set(entry)}
    else{weights=weights.filter(w=>w.date!==entry.date).concat(entry);lsSet("gymlog-weights",weights);render()}
    toast("Berat "+String(entry.kg).replace(".",",")+" kg tersimpan");
  }catch(_){toast("Gagal menyimpan. Coba lagi.")}
});
function useLocal(){setTimeout(()=>scheduleSync(100),0);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(_){}mode="local";sessions=lsGet("gymlog-sessions")||[];weights=lsGet("gymlog-weights")||[];profile=lsGet("gymlog-profile");habitDone=lsGet("gymlog-habits-"+dateKey())||[];photos=lsGet("gymlog-photos")||[];mealDone=lsGet("gymlog-meals-"+dateKey())||[];draft=null;render()}

async function init(){
  const h=(location.hash||"").slice(1);if(["hari","makan","riwayat","target","program"].includes(h))tab=h;
  try{render()}catch(err){console.error(err)}
  if(!window.claude||!window.claude.use){useLocal();return}
  /* kalau sinkron akun tidak menjawab dalam 6 detik, pakai penyimpanan browser supaya aplikasi tetap jalan */
  const giveUp=setTimeout(()=>{if(mode==="loading"){useLocal();toast("Sinkron akun lambat. Data disimpan di browser ini dulu.")}},6000);
  const within=(pr,ms)=>Promise.race([pr,new Promise(r=>setTimeout(()=>r(null),ms))]);
  try{
    const [db,user]=await within(Promise.all([claude.use("db"),claude.use("user")]),5000)||[null,null];
    const uid=user?await within(user.id(),3000):null;
    if(!db||!uid){clearTimeout(giveUp);if(mode==="loading")useLocal();return}
    col=db.collection("data/users/"+uid);
    let first=true;
    col.onSnapshot(snap=>{
      sessions=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).filter(s=>s.ts&&s.workout);
      const md=snap.docs.find(d=>d.exists&&d.id==="m-"+dateKey());
      mealDone=md&&Array.isArray(md.data().done)?[...md.data().done]:[];
      weights=snap.docs.filter(d=>d.exists&&d.id.startsWith("w-")).map(d=>d.data()).filter(w=>w.kg&&w.date);
      const hd=snap.docs.find(d=>d.exists&&d.id==="h-"+dateKey());habitDone=hd&&Array.isArray(hd.data().done)?[...hd.data().done]:[];
      const pf=snap.docs.find(d=>d.exists&&d.id==="profile");profile=pf?pf.data():null;
      const pd=snap.docs.find(d=>d.exists&&d.id==="photos");photos=pd&&Array.isArray(pd.data().dates)?[...pd.data().dates]:[];
      mode="db";clearTimeout(giveUp);
      if(first){first=false;const keep=loadDraft();if(!keep||!Object.values(keep.sets).flat().some(x=>x.kg||x.reps))draft=null}
      const a=document.activeElement;if(tab==="hari"&&a&&a.dataset&&a.dataset.ex){$("#sync").textContent="Tersimpan otomatis di akunmu";return}
      render();
    },()=>{clearTimeout(giveUp);useLocal();toast("Sinkron terputus. Data disimpan di browser ini.")});
  }catch(_){clearTimeout(giveUp);if(mode!=="db")useLocal()}
}
init();
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")hideDemo()});
requestAnimationFrame(animLoop);
